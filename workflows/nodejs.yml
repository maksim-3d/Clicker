name: Node.js CI

on:
  push:
    branches: [ master-branch ]
  pull_request:
    branches: [ master-branch ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'
    
    - name: Install dependencies
      run: npm install

    - name: Run server
      run: node server.js
